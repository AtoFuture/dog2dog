schema_version: 1
backend: gazebo_go2
use_sim_time: true
topics:
  nav_command: /runtime/nav2_cmd
  guarded_input: /runtime/scaled_cmd
  actuator_command: /robot1/cmd_vel
  scan: /robot1/velodyne
  odometry: /robot1/odometry/filtered
  imu: /robot1/imu_plugin/out
  battery: /runtime/battery_state
  mission: /mission_state
  command: /g3/command
  guard_status: /runtime/velocity_guard_status
  map: /robot1/map
  planning_map: /runtime/planning_map
  action: /robot1/navigate_to_pose
  tf: /robot1/tf
  tf_static: /robot1/tf_static
frames:
  map: map
  odom: odom
  base: base_link
guard:
  rate_hz: 20.0
  clearance_margin_m: 0.05
  prediction_horizon_s: 0.5
  prediction_speed_mps: 0.4
  command_timeout_s: 0.5
  sensor_timeout_s: 1.0
  battery_timeout_s: 3.0
  mission_timeout_s: 2.0
  stamp_future_tolerance_s: 0.1
  linear_max: 0.03
  angular_max: 0.8
  front_half_angle_rad: 0.5
  front_clearance_m: 0.24
  max_tilt_rad: 0.6
scaler:
  linear_scale: 0.075
  linear_max: 0.03
  linear_min: 0.02
  nav_deadband: 0.005
  angular_scale: 1.667
  angular_max: 1.0
  linear_accel: 0.06
  linear_decel: 0.1
  angular_accel: 2.0
  angular_decel: 2.0
  ramp_rate: 50.0
  cmd_timeout: 1.0
navigation:
  robot_radius_m: 0.4
  inflation_radius_m: 0.65
  desired_linear_velocity_mps: 0.32
corridor:
  enabled: true
  steering_enabled: true
  max_width_m: 1.9
  min_span_m: 1.5
  wall_tolerance_m: 0.05
  lookahead_m: 0.5
  heading_gain: 1.2
  turn_rate_radps: 0.4
  max_heading_error_rad: 0.2
  approach_distance_m: 1.0
  path_lookahead_m: 1.0
  alignment_tolerance_rad: 0.08
  alignment_confirmations: 3
return_localization:
  enabled: true
  stale_s: 1.0
  jump_translation_m: 0.35
  jump_yaw_rad: 0.5
  stationary_linear_mps: 0.03
  stationary_angular_radps: 0.08
  stationary_drift_m: 0.08
  stationary_drift_yaw_rad: 0.12
  position_tolerance_m: 0.35
  yaw_tolerance_rad: 0.45
  stable_s: 3.0
  verification_timeout_s: 10.0
  max_corrections: 2
  scan_match_required: true
  scan_match_rmse_m: 0.18
  scan_match_min_inlier_ratio: 0.35
  scan_match_max_correspondence_m: 0.75
  scan_match_min_points: 40
  scan_match_max_points: 360
  scan_match_max_iterations: 15
  scan_match_convergence_m: 0.002
  max_scan_correction_m: 1.8
  max_scan_correction_yaw_rad: 1.2
mission:
  heartbeat_period_s: 0.5
  recovery_stale_s: 2.0
  recovery_stable_s: 3.0
  recovery_timeout_s: 60.0
  low_battery_threshold: 0.2
  home_x: 0.0
  home_y: 0.0
  home_yaw: 0.0
explorer:
  max_bootstrap_scans: 3
  require_path_clearance: true
  task_completion_enabled: true
  exploration_budget_s: 900.0
  coverage_stall_s: 180.0
  coverage_min_gain_m2: 0.5
  candidate_wait_s: 90.0
  no_frontier_confirm_s: 10.0
  max_region_failures: 2
  max_consecutive_failures: 6
  tick_period_s: 0.75
  min_goal_distance_m: 0.5
battery_model:
  initial_percentage: 0.8
  moving_drain_per_sec: 0.001
  idle_drain_per_sec: 0.0001
  publish_rate_hz: 4.0
decision:
  candidate_selector: deepseek
  mission_instruction: Explore the unknown environment safely and efficiently.
  brain_base_url: https://api.deepseek.com
  brain_model: deepseek-flash
  brain_timeout: 15.0
  brain_max_candidates: 6
