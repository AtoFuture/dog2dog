# 倒地感知用的 ByteTrack 配置。
#
# ============================================================================
# 为什么不能直接用 bytetrack.yaml（2026-09-18，真实倒地录像实测）
#
# 倒地判据要求**同一个 track_id 跨越整个倒地过程**：
#     「见过他直立」-> 「转为水平」-> 「保持住」-> 才是一次倒地事件
# 而默认的 bytetrack.yaml 做不到这一点。实测（fall-01-cam0.mp4）：
#
#     配置                        id 集合       跨越倒地
#     bytetrack.yaml（默认）      [1, 3, 8]     ❌
#     botsort.yaml（默认）        [1, 3, 6]     ❌
#     **本文件（match_thresh=0.95）** [1]        ✅ id1 帧 0~159
#
# ----------------------------------------------------------------------------
# 元凶是 match_thresh，不是 new_track_thresh（消融实验确认，单改一个参数）：
#
#     只改 match_thresh 0.8->0.95     ✅ 单独就够
#     只改 track_buffer 30->90        ❌
#     只改 new_track_thresh 0.6->0.2  ❌
#     只改 track_high_thresh 0.6->0.25 ❌
#
# 因为 match_thresh 是**关联代价上限**（等价于要求 IoU > 1-match_thresh）：
# 默认 0.8 要 IoU>0.2，而人一倒地，框从「高瘦」变成「扁宽」，
# 与倒地前那一帧的 IoU 掉到 0.2 以下 —— 旧轨迹就再也绑不回来了。
# 放到 0.95（IoU>0.05）才绑得住。
#
# ⚠️ 这个值来自**一段**倒地视频，过拟合的风险是实打实的。
# 放宽关联的代价是：两个人挨得近时更容易被并成一条轨迹。
# 真机上要用 `tools/check_track_continuity.py` 在更多素材上复核，
# 尤其是**多人场景**。
# ============================================================================

tracker_type: bytetrack

track_high_thresh: 0.6    # 保持默认：第一轮关联用的高置信度门限
track_low_thresh: 0.25    # 保持默认：第二轮用低置信度框找回来
new_track_thresh: 0.6     # 保持默认：新建轨迹的门限（实测它不是瓶颈）

track_buffer: 30          # 保持默认：丢失后保留 30 帧。实测加到 90 也没帮助

# ★ 唯一改动：放宽关联。见上面的说明。
match_thresh: 0.95

fuse_score: True
