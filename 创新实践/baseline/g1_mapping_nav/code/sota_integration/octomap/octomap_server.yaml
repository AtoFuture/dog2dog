/**:
  ros__parameters:
    resolution: 0.05              # match cross_warehouse_* (Nav2 costmap)
    frame_id: map                 # octomap_server transforms clouds into this frame
    point_cloud_min_z: 0.10       # drop floor returns (map-frame height)
    point_cloud_max_z: 1.60       # drop ceiling returns (shrinks octree RAM)
    occupancy_min_z: 0.10         # only this z-band is projected to 2D
    occupancy_max_z: 1.60
    sensor_model.max_range: 12.0  # VERIFY vs sim velodyne max range
    sensor_model.hit: 0.70
    sensor_model.miss: 0.40
    sensor_model.min: 0.12
    sensor_model.max: 0.97
    filter_speckles: true
    filter_ground_plane: false
    compress_map: true
    incremental_2D_projection: false
    publish_free_space: true
    latch: true                   # transient_local so map_saver_cli receives it
    max_depth: 16
