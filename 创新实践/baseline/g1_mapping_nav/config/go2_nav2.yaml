amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    # ── 2026-09-23 收紧（G1 P1）──────────────────────────────
    # 原值 transform_tolerance=10.0 / update_min_a=0.2 / update_min_d=0.25。
    # 后果：AMCL 要动 25 cm 或转 0.2 rad 才更新一次，实测 75 s 只出 18~35 次
    # 位姿（约 0.3 Hz）；而 Nav2 的 goal checker 判的是 **AMCL 的位姿**，
    # 于是它拿陈旧估计判「到位了」，真值却在容差外——
    # 实测 G2 那轮 AMCL 对真值最大偏 0.464 m，action 报 SUCCEEDED 而真值差 0.362 m。
    # transform_tolerance=10.0 还允许 Nav2 使用 10 秒前的陈旧变换。
    # 2026-10-14：AMCL 用 transform_tolerance 把 map->odom 时间戳推到 future，
    # 导致与 odom->base_link（sim time）差 5s，TF2 无法 compose map->base_link。
    # 改 0.1：AMCL 只把 map->odom 推后 0.1s，TF2 可以 interpolate。
    transform_tolerance: 0.1
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: velodyne
    # ── 2026-09-25 新增：初始位姿写进配置 ──────────────────────────
    # 原来整份配置里没有 set_initial_pose/initial_pose 任何一项，AMCL 必须靠外部
    # 发 /robot1/initialpose 才会出 map→odom（见 tools/set_initial_pose.sh 顶部）。
    # 不发就永远不出 map→odom → 规划直接失败。G3 第一次真实 RETURN 的 goal
    # 被 ABORTED，这一条是原因之一（只读诊断：map→odom 时间戳还超前 /clock 9.98 s）。
    #
    # 任务从基站起步，所以填基站（=出生点）位姿。狗不是从基站起的，仍然用
    # tools/set_initial_pose.sh 从真值覆盖（那个脚本会发 /robot1/initialpose，
    # 优先级高于这里）。
    set_initial_pose: true
    initial_pose:
      x: 7.01
      y: 5.94
      z: 0.0
      yaw: -0.43

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    # 2026-09-25：原来是 /odom，而那个话题 **Publisher count = 0** —— 狗的里程计
    # 发在 /robot1/odom 上（只读诊断实测）。bt_navigator 在 /robot1 命名空间下，
    # 写相对名 odom 也能解析对，但绝对名最不容易踩。
    # 2026-10-14：改用 GT odom（/g1/ground_truth），腿式 odom 漂移 40m/10min
    # 导致 AMCL 定位飞掉。GT relay 从 Gazebo 真值打戳发布，frame=gt_odom。
    odom_topic: /g1/ground_truth
    bt_loop_duration: 10
    default_server_timeout: 20
    # 2026-10-11：自定义BT，对标狗上真机 nav2_real_bt.xml：
    #   删 BackUp（腿式倒退不稳）、Spin 1.2rad（更快恢复）、6次重试
    default_nav_to_pose_bt_xml: "/home/wy/go2_sim_ws/nav2_go2_bt.xml"
    # 'default_nav_through_poses_bt_xml' uses default:
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # 2026-09-24 对齐：仿真工作区那份是 60.0，本仓库一直是 10.0。
      # nav2_scaled.launch.py 加载的是本文件，所以 P1 那 5 轮实际跑的是 10.0。
      # 10 s 太紧：准直/重规划阶段一动不到 0.5 m 就判 "Failed to make progress"，
      # amcl_G5 那轮因此连挨两次中止、到点耗时 86 s（详见 tools/README.md）。
      movement_time_allowance: 60.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # 2026-10-11：0.25→6.28(2π=永真)。探索/frontier场景终点朝向无意义，
      # RPP+RotationShim无法在路径终点做纯原地转向对齐目标航向：
      # xy已达但yaw永差→SimpleGoalChecker stateful锁定xy后RPP绕目标打转→超时。
      # 对标狗上真机nav2_real.yaml同设6.28。
      yaw_goal_tolerance: 6.28
    # RegulatedPurePursuit parameters (replaced DWB due to TF time sync issues)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.26
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_time_based_lookahead: false
      rotate_to_heading_angular_vel: 0.8  # 2026-10-11：保持0.8，仿真反馈20Hz够快（狗上真机0.5）
      max_allowed_time_to_collision: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      allow_reversing: false
      max_angular_accel: 1.2            # 2026-10-11：保持1.2，仿真可以快转（狗上真机0.8）
      # rotate_to_heading_min_angle: 2.6  # 2026-10-11试加但仿真窄通道转不过来，注释掉留真机用
      transform_tolerance: 0.5
      goal_dist_tol: 0.25
      control_duration: 0.02
      use_collision_detection: true
      max_allowed_linear_accel: 0.5

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.26          # 2026-10-11：0.22→0.26，实际对角线0.236留2cm余量（狗上真机0.35太保守堵通道）
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # 2026-09-25：原来写相对名 velodyne —— costmap 节点在
          # /robot1/local_costmap 命名空间下，相对名会解析成
          # /robot1/local_costmap/velodyne（无发布者）！
          # 实测 local_costmap 订的就是那个空话题，所以它 3600/3600 cell 全 free，
          # **避障一直是失效的**。必须是绝对名。
          # 注：AMCL 那条 scan_topic: velodyne 反而是对的——它在 /robot1 下。
          topic: /robot1/velodyne
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.26          # 2026-10-11：0.22→0.26，与local_costmap一致，对角线0.236留余量
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # 同 local_costmap：相对名会解析到 /robot1/global_costmap/velodyne。
          topic: /robot1/velodyne
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ── SLAM（P1 第 5 项：边跑边建图）────────────────────────────────
# 只在 nav2_scaled.launch.py 传 slam:=true 时生效：那时 nav2_bringup 会走
# slam_launch.py 替掉 map_server+amcl，由 slam_toolbox 出 map→odom。
#
# 为什么不用 scripts/start_slam.sh：那个是另起一个 slam_toolbox 进程，
# 会和 AMCL 抢 map→odom；而且它把 Domain 42 写死了、不在隔离流程里。
#
# 这一段放在这里（而不是单独一份 slam 参数文件）是被 bringup 逼的：
# bringup_launch.py 只接受**一个** params_file，并把它同时透传给
# slam_launch.py 和 Nav2 各节点。
#
# ⚠️ 为什么这里有两个键，而且真正的参数写在带命名空间的那个下面：
#   两个键各满足一半需求，缺一个就静默失效（2026-09-24 实测踩过）：
#   1) nav2 的 slam_launch.py 用 `HasNodeParams(node_name='slam_toolbox')` 判断
#      要不要加载这份参数，它只做 `'slam_toolbox' in data.keys()`——
#      **必须有一个恰好叫 `slam_toolbox` 的顶层键**，否则直接退回 slam_toolbox
#      自带的默认参数文件。
#   2) 但这份文件是当**原始 --params-file** 传给节点的（不是经 launch 的 Node
#      action，那种会被改写成全限定名）。rcl 只认全限定名/通配符：
#       slam_toolbox:        → 不匹配节点 /robot1/slam_toolbox，参数全部丢弃
#       /robot1/slam_toolbox: → 匹配 ✓
#   实测：裸键那次节点跑的是**代码默认值**（base_frame=base_footprint、
#   scan_topic=/scan、transform_publish_period=0.05），图一条都建不出来。
#   用小节点对照验过：裸键 → base_footprint；全限定键 → 生效。
#
# ⚠️ 2026-10-11 在**真 nav2_bringup 通路**上把这件事测死了（不用仿真：参数在
#   节点构造时就定好，与有没有 scan 无关）：起 nav2_scaled.launch.py slam:=True，
#   30 s 后 `ros2 param get /robot1/slam_toolbox base_frame`：
#
#     | 键的写法                     | base_frame     | scan_topic | launch |
#     |------------------------------|----------------|------------|--------|
#     | 只有裸键 `slam_toolbox:`      | base_footprint | /scan      | 存活   |
#     | 裸键空壳 + `/robot1/slam_toolbox:` | **base_link** | **velodyne** | **存活** |
#
#   所以：**两键缺一不可**，而且**不会**像下面那条 FIX 注释担心的那样「把命名空间
#   拼成 /robot1//robot1/ 导致 bringup 全挂」—— 实测 launch 全程存活。
#   那条 FIX 注释（2026-09-24）已被推翻，留着当历史，别再照它改回裸键。
#
# 2026-10-11 实测：/robot1/slam_toolbox 键会拼成 /robot1//robot1/ 导致 rcl 解析失败。
# 用裸键 slam_toolbox，RewrittenYaml 会自动加 namespace 前缀。
slam_toolbox:
  ros__parameters: {}

# ---------------------------------------------------------------------------
# velocity_smoother（从真机 nav2_real.yaml 吸收，2026-10-12）
# 仿真不需要（gz-sim 步态稳定），真机部署时启用。
# 腿式机器人关键约束：
#   - min_x=0 禁倒车（Go2 后退步态不稳定）
#   - max_accel 软加速度（腿式步态跟不上急加速）
#   - velocity_timeout=1.0 超时急停（cmd_vel 断流时发零速度）
# ---------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.4]
    min_velocity: [0.0, 0.0, -0.4]
    max_accel: [0.3, 0.0, 0.6]
    max_decel: [-0.4, 0.0, -0.8]
    odom_topic: "/robot1/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
