# EKF 融合（真机）：机体系速度(utlidar差分, 对yaw翻转免疫) + body IMU航向(陀螺)
# BYY修复⑨⑫：utlidar yaw ±180°弹跳时位置增量方向也翻——直接融合位置会把
# IMU 航向拖歪（09-20 实测）。机体系速度的 yaw 误差在分子分母精确相消。
ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.3
    print_diagnostics: false
    debug: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom          # 发布 odom→base_link
    publish_tf: true
    # utlidar（桥接 Odometry）：只取机体系速度 vx,vy（不取位置/yaw）
    odom0: /baiyanggo/webrtc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    # body IMU（桥接 Imu）：只取 yaw（差分模式=积分相对转角，陀螺质量）
    imu0: /baiyanggo/webrtc/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: true
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
